version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports: ["5432:5432"]
  api:
    build: ./api
    depends_on: [postgres]
    ports: ["8000:8000"]
    command: uvicorn main:app --host 0.0.0.0 --port 8000
